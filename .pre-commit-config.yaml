# Install with `pre-commit install`. That alone only wires the pre-commit
# stage, which would leave the commit-msg and pre-push hooks dormant —
# declaring the hook types here is what makes one command enough.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # Not decoration: `.cliff.toml` groups the CHANGELOG by these prefixes
      # and that file becomes the release notes. commit-lint.yml re-checks the
      # same rule, for anyone who never ran `pre-commit install`.
      - id: conventional-pre-commit
        stages:
          - commit-msg

  - repo: local
    hooks:
      # Each gate at the cheapest stage that still catches it. Everything
      # per-commit breeds the `--no-verify` habit CLAUDE.md forbids.
      - id: golangci-lint-fmt
        name: golangci-lint fmt --diff
        entry: golangci-lint fmt --diff
        language: system
        types: [go]
        pass_filenames: false
        stages:
          - pre-commit

      # Pre-push, not earlier, for a reason specific to this repository: the
      # licensing sweep (internal/repocheck) inside `task check` enumerates
      # GIT-TRACKED files, so pre-push is the first stage where its verdict
      # matches a reviewer's.
      #
      # Not filtered by file type: the sweep reads prose too, and `types: [go]`
      # would skip the commits likeliest to introduce a bad reference.
      - id: task-check
        name: task check (format, lint, test)
        entry: task check
        language: system
        pass_filenames: false
        stages:
          - pre-push
