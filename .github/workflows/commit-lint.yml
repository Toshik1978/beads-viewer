name: Commit messages

# Conventional Commits, for contributors who never ran `pre-commit install`.
# Runs the repo's own commit-msg hook, so the rule has one definition rather
# than two that can drift. Not cosmetic: `.cliff.toml` builds the CHANGELOG
# from these prefixes, so a commit that does not parse is one missing from the
# release notes. NO PATH FILTER — a docs-only change still has a subject.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script walks a commit range, so it needs the ancestors.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pipx install pre-commit

      # Keyed by the config that pins the rev, so a bump invalidates it.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-commit-msg-${{ hashFiles('.pre-commit-config.yaml') }}

      # PR: its own commits. Push: what the push added. `before` is all zeros
      # on a branch's first push, which the script falls back out of.
      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/check-commit-messages.sh "$BASE" "$HEAD_SHA"
